name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: QA - run unit tests
        shell: bash
        run: gradle testReleaseUnitTest --stacktrace 2>&1 | tee -a build.log

      - name: Build APKs
        shell: bash
        run: gradle assembleRelease --stacktrace 2>&1 | tee -a build.log

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk SocialSaver-arm64.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk SocialSaver-armv7.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SocialSaver-apks
          path: SocialSaver-*.apk

      - name: Publish release (download it from your phone)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Social Saver build ${{ github.run_number }}
          body: |
            Install **SocialSaver-arm64.apk** on your phone.
            Use SocialSaver-armv7.apk only if arm64 won't install (very old phones).
          files: SocialSaver-*.apk
          make_latest: true

      - name: Publish the error log if the build failed
        if: failure() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: failed-${{ github.run_number }}
          name: Failed build ${{ github.run_number }}
          body: The build failed. The log is attached.
          files: build.log
          prerelease: true
          make_latest: false
